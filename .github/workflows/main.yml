name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # เปลี่ยนเป็น assembleDebug เพื่อให้ระบบเซ็นแอปอัตโนมัติ ไม่ต้องการ Keystore Secrets
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon \
            -PappVersion="1.0.0" \
            -PappCode="${{ github.run_number }}"

      # คัดลอกไฟล์แอปที่สร้างเสร็จจากโฟลเดอร์ debug มาเตรียมส่งออก
      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/PDF-to-Converter888.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Converter888-apk
          path: output/PDF-to-Converter888.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/PDF-to-Converter888.apk
          generate_release_notes: true
