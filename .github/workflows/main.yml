name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # ใช้คำสั่งภายในของระบบ setup-gradle เพื่อสร้างคำสั่งคอมไพล์โดยตรง ไม่ต้องใช้ gradlew ในเครื่อง
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersion="1.0.0" \
            -PappCode="${{ github.run_number }}"

      - name: Rename and Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/PDF-to-Converter888.apk || cp app/build/outputs/apk/release/app-release.apk output/PDF-to-Converter888.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Converter888-apk
          path: output/PDF-to-Converter888.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/PDF-to-Converter888.apk
          generate_release_notes: true
